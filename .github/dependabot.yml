version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns:
          - "next"
          - "next-intl"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      animation:
        patterns:
          - "gsap"
          - "@gsap/*"
          - "lenis"
      tooling:
        patterns:
          - "@biomejs/*"
          - "husky"
          - "lint-staged"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
