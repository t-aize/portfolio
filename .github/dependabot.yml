version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      three:
        patterns:
          - "three"
          - "@types/three"
          - "@react-three/*"
          - "troika-three-text"
          - "maath"
      animation:
        patterns:
          - "gsap"
          - "@gsap/*"
          - "lenis"
      tooling:
        patterns:
          - "@biomejs/*"
          - "husky"
          - "lint-staged"
          - "vite"
          - "@vitejs/*"
          - "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
