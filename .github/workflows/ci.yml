name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  ci:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (format, lint, assist)
        run: bun run ci

      - name: Type-check
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-output
          path: .next/
          retention-days: 7
          if-no-files-found: error
          # .next/ is a dot-directory — upload-artifact's glob excludes
          # hidden paths by default, which silently matches nothing here.
          include-hidden-files: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependency changes
        uses: actions/dependency-review-action@v5.0.0
